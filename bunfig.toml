[install]
exact = true

[run]
shell = "bun"
noOrphans = true
bun = false

[fmt]
printWidth = 100
sortImports = true
sortPackageJson = true
ignorePatterns = [
  "license/**",
  "bun.lock",
  "dist/**",
  "src/generated/**",
  "shared/generated/**",
  "playwright-report/**",
  "test-results/**",
]

[lint]
typeAware = true
typeCheck = true
maxWarnings = 0
reportUnusedDisableDirectives = "error"
ignorePatterns = [
  "dist/**",
  "src/generated/**",
  "shared/generated/**",
  "playwright-report/**",
  "test-results/**",
]

# Explicit rules avoid size limits, arbitrary extraction, and incompatible stylistic alternatives.
# All rules are built into Bun; no external lint or formatting packages are used.
[lint.rules]
"@typescript-eslint/array-type" = ["error", { default = "array-simple" }]
